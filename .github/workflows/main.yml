
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar arquivos Android
        run: |
          echo "Verificando projeto Android..."
          ls -la
          test -d android-app || (echo "ERRO: pasta android-app nao encontrada" && exit 1)
          find android-app -maxdepth 3 -type f | head -100

      - name: Compilar APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkLV-Android-APK
          path: android-app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
